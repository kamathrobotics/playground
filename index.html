<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/kamath_robotics_favicon.svg">
  <title>Sandbox</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="canvas-container"></div>

  <div id="controls">

    <!-- Page title + robot selector + info button -->
    <div class="selector-row">
      <h1 class="app-title">Sandbox</h1>
      <div class="robot-selector">
        <select id="robotSelect">
          <option value="lekiwi" selected>LeKiwi</option>
          <option value="so101">SO101</option>
          <option value="pt101">PT101</option>
          <option value="kr003">KR003</option>
          <option value="akros">AKROS</option>
        </select>
      </div>
      <a id="infoButton" class="info-button" aria-label="View on GitHub" href="#" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
        </svg>
      </a>
    </div>

    <!-- Controls section -->
    <div class="collapsible open" id="controlsSection">
      <div class="collapsible-header">
        <span>Controls</span>
        <span class="collapsible-icon">▾</span>
      </div>
      <div class="collapsible-content">

        <!-- Wheeled-only controls: hidden when an arm robot is loaded -->
        <div id="wheeled-controls">

          <!-- Key grid -->
          <div class="key-grid">
            <div class="key-row">
              <div class="key" id="key-q">
                <span class="key-letter">Q</span>
                <span class="key-symbol">↺</span>
              </div>
              <div class="key movement-key" id="key-w">
                <span class="key-letter">W</span>
                <span class="key-symbol">↑</span>
              </div>
              <div class="key" id="key-e">
                <span class="key-letter">E</span>
                <span class="key-symbol">↻</span>
              </div>
            </div>
            <div class="key-row">
              <div class="key movement-key" id="key-a">
                <span class="key-letter">A</span>
                <span class="key-symbol">←</span>
              </div>
              <div class="key movement-key" id="key-s">
                <span class="key-letter">S</span>
                <span class="key-symbol">↓</span>
              </div>
              <div class="key movement-key" id="key-d">
                <span class="key-letter">D</span>
                <span class="key-symbol">→</span>
              </div>
            </div>
          </div>

          <!-- Velocity sliders -->
          <div class="slider-group">
            <div class="slider-item">
              <div class="slider-header">
                <span class="slider-label">Max Linear</span>
                <span class="slider-value-badge"><span id="linearVelocityValue">0.10</span> m/s</span>
              </div>
              <input type="range" id="linearVelocitySlider" min="0" max="0.2" step="0.01" value="0.1">
            </div>
            <div class="slider-item">
              <div class="slider-header">
                <span class="slider-label">Max Angular</span>
                <span class="slider-value-badge"><span id="angularVelocityValue">0.79</span> rad/s</span>
              </div>
              <input type="range" id="angularVelocitySlider" min="0" max="1.57" step="0.01" value="0.785398">
            </div>
          </div>

        </div><!-- #wheeled-controls -->

        <!-- Arm-only controls: hidden when a wheeled robot is loaded -->
        <div id="arm-controls" style="display:none">
          <div class="slider-group">

            <div class="slider-item">
              <div class="slider-header">
                <span class="slider-label">Shoulder Pan</span>
                <span class="slider-value-badge"><span id="armSliderValue_shoulder_pan">0.00</span> rad</span>
              </div>
              <input type="range" id="armSlider_shoulder_pan" data-joint-name="shoulder_pan_joint" min="-1.91986" max="1.91986" step="0.01" value="0"
                oninput="document.getElementById('armSliderValue_shoulder_pan').textContent=parseFloat(this.value).toFixed(2);this.blur()">
            </div>

            <div class="slider-item">
              <div class="slider-header">
                <span class="slider-label">Shoulder Lift</span>
                <span class="slider-value-badge"><span id="armSliderValue_shoulder_lift">0.00</span> rad</span>
              </div>
              <input type="range" id="armSlider_shoulder_lift" data-joint-name="shoulder_lift_joint" min="-1.74533" max="1.74533" step="0.01" value="0"
                oninput="document.getElementById('armSliderValue_shoulder_lift').textContent=parseFloat(this.value).toFixed(2);this.blur()">
            </div>

            <div class="slider-item">
              <div class="slider-header">
                <span class="slider-label">Elbow Flex</span>
                <span class="slider-value-badge"><span id="armSliderValue_elbow_flex">0.00</span> rad</span>
              </div>
              <input type="range" id="armSlider_elbow_flex" data-joint-name="elbow_flex_joint" min="-1.69" max="1.69" step="0.01" value="0"
                oninput="document.getElementById('armSliderValue_elbow_flex').textContent=parseFloat(this.value).toFixed(2);this.blur()">
            </div>

            <div class="slider-item">
              <div class="slider-header">
                <span class="slider-label">Wrist Flex</span>
                <span class="slider-value-badge"><span id="armSliderValue_wrist_flex">0.00</span> rad</span>
              </div>
              <input type="range" id="armSlider_wrist_flex" data-joint-name="wrist_flex_joint" min="-1.65806" max="1.65806" step="0.01" value="0"
                oninput="document.getElementById('armSliderValue_wrist_flex').textContent=parseFloat(this.value).toFixed(2);this.blur()">
            </div>

            <div class="slider-item">
              <div class="slider-header">
                <span class="slider-label">Wrist Roll</span>
                <span class="slider-value-badge"><span id="armSliderValue_wrist_roll">0.00</span> rad</span>
              </div>
              <input type="range" id="armSlider_wrist_roll" data-joint-name="wrist_roll_joint" min="-2.74385" max="2.84121" step="0.01" value="0"
                oninput="document.getElementById('armSliderValue_wrist_roll').textContent=parseFloat(this.value).toFixed(2);this.blur()">
            </div>

            <div class="slider-item">
              <div class="slider-header">
                <span class="slider-label">Gripper</span>
                <span class="slider-value-badge"><span id="armSliderValue_gripper">0.00</span> rad</span>
              </div>
              <input type="range" id="armSlider_gripper" data-joint-name="gripper_joint" min="-1.74533" max="0.174533" step="0.01" value="0"
                oninput="document.getElementById('armSliderValue_gripper').textContent=parseFloat(this.value).toFixed(2);this.blur()">
            </div>

          </div>
        </div><!-- #arm-controls -->

        <!-- Toggle button: only shown when LeKiwi base is selected -->
        <div id="pt101-toggle-row" style="display:none">
          <button id="pt101Button" class="toggle-button">Pan Tilt Module</button>
        </div>

        <!-- Pan/tilt sliders: shown when PT101 is active -->
        <div id="pantilt-controls" style="display:none">
          <div class="slider-group">

            <div class="slider-item">
              <div class="slider-header">
                <span class="slider-label">Pan</span>
                <span class="slider-value-badge"><span id="ptSliderValue_pan">0.00</span> rad</span>
              </div>
              <input type="range" id="ptSlider_pan" data-joint-name="pan_joint" min="-2" max="2" step="0.01" value="0"
                oninput="document.getElementById('ptSliderValue_pan').textContent=parseFloat(this.value).toFixed(2);this.blur()">
            </div>

            <div class="slider-item">
              <div class="slider-header">
                <span class="slider-label">Tilt</span>
                <span class="slider-value-badge"><span id="ptSliderValue_tilt">0.00</span> rad</span>
              </div>
              <input type="range" id="ptSlider_tilt" data-joint-name="tilt_joint" min="-1.5708" max="1.5708" step="0.01" value="0"
                oninput="document.getElementById('ptSliderValue_tilt').textContent=parseFloat(this.value).toFixed(2);this.blur()">
            </div>

          </div>
        </div><!-- #pantilt-controls -->

        <!-- E-Stop + Home — always present regardless of robot type -->
        <div class="bottom-controls-row">
          <div class="key estop-key estop-wide" id="key-x">
            <span class="estop-label">E-STOP / X</span>
          </div>
          <button id="resetButton" class="info-button" aria-label="Reset view">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="2" x2="5" y1="12" y2="12"/>
              <line x1="19" x2="22" y1="12" y2="12"/>
              <line x1="12" x2="12" y1="2" y2="5"/>
              <line x1="12" x2="12" y1="19" y2="22"/>
              <circle cx="12" cy="12" r="7"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

      </div>
    </div>

    <div id="loadingStatus">Loading models…</div>

  </div>

  <a href="https://kamathrobotics.com/" target="_blank" id="footer-logo-link">
    <img src="assets/kamath_robotics_logo_dark.svg" alt="Kamath Robotics" id="logo">
  </a>

  <!-- CDN dependencies loaded as classic scripts so THREE / URDFLoader become globals -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/urdf-loader@0.12.6/umd/URDFLoader.js"></script>

  <!-- App entry point (ES module — deferred by default, runs after DOM + classic scripts) -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
