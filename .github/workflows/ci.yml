name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint HTML/JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint HTML
        run: npx --yes htmlhint index.html

      - name: Check JS syntax
        run: |
          for f in $(find js -name '*.js'); do
            echo "Checking $f"
            node --check "$f"
          done

  link-check:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-loopback README.md index.html
          fail: true
